version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting a fresh release: a compromised or broken
    # upstream tag is usually caught in that window.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      php-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
